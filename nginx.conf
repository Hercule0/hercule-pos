server {
    listen 8080;
    listen [::]:8080;

    # The Azure App Service Linux PHP container deploys to this path
    root /home/site/wwwroot;

    index index.php index.html;

    # Increase upload/request size limits
    client_max_body_size 32M;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Block access to sensitive directories
    location ~ ^/(config|includes|keys|db|tests|scripts)(/|$) {
        deny all;
        return 403;
    }

    # Block dot files
    location ~ /\. {
        deny all;
        return 403;
    }

    # Block sensitive file extensions
    location ~* \.(env|sh|sql|pem|key|lock)$ {
        deny all;
        return 403;
    }

    # Serve static assets directly (CSS, JS, images, icons, fonts)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webmanifest|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Main routing: try the URI as a file first, then a directory, then fall back to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Route all .php files through PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
