name: Validate and deploy PHP app

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hercule-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: pos
  PHP_VERSION: '8.3'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Validate PHP syntax
        run: find . -path './deploy_package' -prune -o -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate operational scripts
        run: bash -n scripts/*.sh

      - name: Repository secret gate
        run: bash scripts/security-gate.sh

      - name: Validate Composer metadata and lock freshness
        run: composer validate --no-check-publish --strict

      - name: Install dependencies from lockfile
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Run test suite
        run: |
          php tests/run_test.php
          php tests/run_regressions.php
          php tests/test_update_signer.php

      - name: Prepare deployment package
        run: |
          echo "Preparing PHP application..."
          composer install --no-dev --prefer-dist --no-progress --no-interaction --classmap-authoritative
          rm -rf deploy_package
          mkdir deploy_package
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy_package' \
            --exclude='tests' \
            --exclude='setup.sh' \
            --exclude='web.config' \
            ./ deploy_package/

      - name: Upload validated deployment package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24
        with:
          name: hercule-server-deploy
          path: deploy_package
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download validated package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 / Node 24
        with:
          name: hercule-server-deploy
          path: deploy_package

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2 / Node 24
        with:
          client-id: 150cc0b0-555b-4674-a977-dfb62f7387ec
          tenant-id: cb4f9603-299f-4515-b736-2d50c9c37494
          subscription-id: e2eb7728-917f-4818-b7d7-8e82228f9d22

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8 / Node 24
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy_package

      - name: Verify deployed application health
        shell: bash
        run: |
          APP_HOST="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].defaultHostName | [0]" --output tsv)"
          if [ -z "$APP_HOST" ]; then
            echo "Could not resolve the deployed Azure Web App hostname."
            exit 1
          fi
          HEALTH_URL="https://$APP_HOST/public/health.php?format=json"
          echo "Waiting for application and database readiness at $HEALTH_URL"
          for attempt in {1..12}; do
            if bash deploy_package/scripts/check_production_health.sh "$HEALTH_URL"; then
              echo "Deployment health verification passed."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Deployment did not become application+database healthy."
              exit 1
            fi
            echo "Health verification attempt $attempt/12 failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Verify Entitlement v2 production routes
        shell: bash
        run: |
          APP_HOST="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].defaultHostName | [0]" --output tsv)"
          if [ -z "$APP_HOST" ]; then
            echo "Could not resolve the deployed Azure Web App hostname."
            exit 1
          fi
          bash deploy_package/scripts/check_entitlement_v2_routes.sh "https://$APP_HOST"

      - name: Diagnose Azure runtime drift
        shell: bash
        run: |
          set -Eeuo pipefail
          resource_group="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" --output tsv)"
          APP_HOST="$(az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" --query defaultHostName --output tsv)"

          echo "=== App Service runtime topology ==="
          instances_json="$(az webapp list-instances --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" --output json 2>/dev/null || echo '[]')"
          echo "instance_count=$(jq 'length' <<<"$instances_json")"
          jq '[.[] | {name:(.name // .id // "unknown"), state:(.state // "unknown"), status:(.status // "unknown")}]' <<<"$instances_json"

          echo "=== Deployment Center source ==="
          source_json="$(az webapp deployment source show --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" --output json 2>/dev/null || echo '{}')"
          jq '{repoUrl:(.repoUrl // null), branch:(.branch // null), isManualIntegration:(.isManualIntegration // null), isMercurial:(.isMercurial // null)}' <<<"$source_json"

          echo "=== Non-secret deployment/storage settings ==="
          az webapp config appsettings list --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE' || name=='WEBSITES_ENABLE_APP_SERVICE_STORAGE' || name=='WEBSITE_ENABLE_SYNC_UPDATE_SITE' || name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].{name:name,value:value}" \
            --output table

          profile="$(az webapp deployment list-publishing-profiles --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" --output json --query "[?publishMethod=='MSDeploy'] | [0]")"
          kudu_user="$(jq -r '.userName // empty' <<<"$profile")"
          kudu_pass="$(jq -r '.userPWD // empty' <<<"$profile")"
          publish_url="$(jq -r '.publishUrl // empty' <<<"$profile")"
          if [ -z "$kudu_user" ] || [ -z "$kudu_pass" ] || [ -z "$publish_url" ]; then
            echo "ERROR: Kudu publishing profile unavailable." >&2
            exit 1
          fi
          echo "::add-mask::$kudu_user"
          echo "::add-mask::$kudu_pass"
          kudu_host="${publish_url#https://}"; kudu_host="${kudu_host#http://}"; kudu_host="${kudu_host%%:*}"; kudu_base="https://${kudu_host}"

          echo "=== Kudu deployment history ==="
          curl --fail --silent --show-error -u "$kudu_user:$kudu_pass" "$kudu_base/api/deployments" \
            | jq '[.[0:10][] | {id,status,status_text,deployer,message,received_time,start_time,end_time,active}]'

          echo "=== Exact Kudu wwwroot v2 file verification ==="
          for rel in validate.php activate.php; do
            expected_file="deploy_package/public/api/v2/$rel"
            actual_file="${RUNNER_TEMP}/kudu-$rel"
            curl --fail --silent --show-error -u "$kudu_user:$kudu_pass" \
              "$kudu_base/api/vfs/site/wwwroot/public/api/v2/$rel" \
              --output "$actual_file"
            expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"
            actual_sha="$(sha256sum "$actual_file" | awk '{print $1}')"
            expected_size="$(wc -c < "$expected_file" | tr -d ' ')"
            actual_size="$(wc -c < "$actual_file" | tr -d ' ')"
            echo "$rel expected_sha=$expected_sha actual_sha=$actual_sha expected_size=$expected_size actual_size=$actual_size"
            if [ "$expected_sha" != "$actual_sha" ] || [ "$expected_size" != "$actual_size" ]; then
              echo "ERROR: Kudu wwwroot $rel does not exactly match the validated deployment artifact." >&2
              exit 1
            fi
          done

          echo "=== Repeated public route probes ==="
          probe_url="https://${APP_HOST}/public/api/v2/validate.php"
          for attempt in {1..12}; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --header 'Accept: application/json' \
              --data '{}' "$probe_url" || true)"
            server="$(awk 'BEGIN{IGNORECASE=1} /^Server:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' "$headers")"
            ctype="$(awk 'BEGIN{IGNORECASE=1} /^Content-Type:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' "$headers")"
            echo "probe ${attempt}/12 status=${status:-curl_error} server=${server:-unknown} content-type=${ctype:-unknown}"
            if [ "$status" != "400" ]; then
              echo "ERROR: runtime drift reproduced during repeated production probe." >&2
              head -c 300 "$body" >&2 || true
              echo >&2
              rm -f "$headers" "$body"
              exit 1
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          echo "Azure runtime drift diagnostic passed: exact Kudu files + 12/12 live probes are healthy."
