name: Validate and deploy PHP app

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hercule-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: pos
  PHP_VERSION: '8.3'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Validate PHP syntax
        run: find . -path './deploy_package' -prune -o -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate operational scripts
        run: bash -n scripts/*.sh

      - name: Repository secret gate
        run: bash scripts/security-gate.sh

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install dependencies from lockfile
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Run test suite
        run: |
          php tests/run_test.php
          php tests/run_regressions.php
          php tests/test_update_signer.php

      - name: Prepare deployment package
        run: |
          echo "Preparing PHP application..."
          composer install --no-dev --prefer-dist --no-progress --no-interaction --classmap-authoritative
          rm -rf deploy_package
          mkdir deploy_package
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy_package' \
            --exclude='tests' \
            --exclude='setup.sh' \
            --exclude='web.config' \
            ./ deploy_package/

      - name: Upload validated deployment package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hercule-server-deploy
          path: deploy_package
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: hercule-server-deploy
          path: deploy_package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 150cc0b0-555b-4674-a977-dfb62f7387ec
          tenant-id: cb4f9603-299f-4515-b736-2d50c9c37494
          subscription-id: e2eb7728-917f-4818-b7d7-8e82228f9d22

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy_package

      - name: Verify deployed application health
        shell: bash
        run: |
          APP_HOST="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].defaultHostName | [0]" --output tsv)"
          if [ -z "$APP_HOST" ]; then
            echo "Could not resolve the deployed Azure Web App hostname."
            exit 1
          fi

          HEALTH_URL="https://$APP_HOST/public/health.php?format=json"
          echo "Waiting for $HEALTH_URL"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL"; then
              echo
              echo "Deployment health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "Deployment did not become healthy."
          exit 1
