name: Validate and deploy PHP app

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hercule-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: pos
  PHP_VERSION: '8.3'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccadd5a048ff273f7fcc4a7b6c09 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Validate PHP syntax
        run: find . -path './deploy_package' -prune -o -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate operational scripts
        run: bash -n scripts/*.sh

      - name: Repository secret gate
        run: bash scripts/security-gate.sh

      - name: Validate Composer metadata and lock freshness
        run: composer validate --no-check-publish --strict

      - name: Install dependencies from lockfile
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Run test suite
        run: |
          php tests/run_test.php
          php tests/run_regressions.php
          php tests/test_update_signer.php

      - name: Prepare deployment package
        run: |
          echo "Preparing PHP application..."
          composer install --no-dev --prefer-dist --no-progress --no-interaction --classmap-authoritative
          rm -rf deploy_package
          mkdir deploy_package
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy_package' \
            --exclude='tests' \
            --exclude='setup.sh' \
            --exclude='web.config' \
            ./ deploy_package/

      - name: Upload validated deployment package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24
        with:
          name: hercule-server-deploy
          path: deploy_package
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download validated package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 / Node 24
        with:
          name: hercule-server-deploy
          path: deploy_package

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2 / Node 24
        with:
          client-id: 150cc0b0-555b-4674-a977-dfb62f7387ec
          tenant-id: cb4f9603-299f-4515-b736-2d50c9c37494
          subscription-id: e2eb7728-917f-4818-b7d7-8e82228f9d22

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8 / Node 24
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy_package

      - name: Verify deployed application health
        shell: bash
        run: |
          APP_HOST="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].defaultHostName | [0]" --output tsv)"
          if [ -z "$APP_HOST" ]; then
            echo "Could not resolve the deployed Azure Web App hostname."
            exit 1
          fi

          HEALTH_URL="https://$APP_HOST/public/health.php?format=json"
          echo "Waiting for application and database readiness at $HEALTH_URL"

          for attempt in {1..12}; do
            if bash deploy_package/scripts/check_production_health.sh "$HEALTH_URL"; then
              echo "Deployment health verification passed."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Deployment did not become application+database healthy."
              exit 1
            fi
            echo "Health verification attempt $attempt/12 failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Verify Entitlement v2 production routes
        shell: bash
        run: |
          APP_HOST="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].defaultHostName | [0]" --output tsv)"
          if [ -z "$APP_HOST" ]; then
            echo "Could not resolve the deployed Azure Web App hostname."
            exit 1
          fi
          bash deploy_package/scripts/check_entitlement_v2_routes.sh "https://$APP_HOST"
