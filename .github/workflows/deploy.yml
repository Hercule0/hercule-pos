name: Deploy PHP app to Azure Web App

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Validate PHP syntax
        run: find . -path './deploy_package' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate operational scripts
        run: bash -n scripts/*.sh

      - name: Run test suite
        run: php tests/run_test.php

      - name: Prepare deployment package
        run: |
          echo "Preparing PHP application..."
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-progress --no-interaction
          fi

          # Build a clean deployment package. We deliberately exclude:
          # - .git / .github: no reason for VCS history or workflow
          #   definitions to ever be reachable on the live web server
          # - tests/: dev-only, not needed in production
          # - get_key.php, "New Text Document.txt": one-off debug scripts
          #   that print real license keys with no auth check — must never
          #   be web-accessible
          rm -rf deploy_package
          mkdir deploy_package
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy_package' \
            --exclude='get_key.php' \
            --exclude='New Text Document.txt' \
            --exclude='tests' \
            --exclude='db' \
            --exclude='setup.sh' \
            --exclude='README.md' \
            --exclude='.htaccess' \
            ./ deploy_package/

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          configured_app_name="${{ vars.AZURE_WEBAPP_NAME }}"
          configured_health_url="${{ vars.PRODUCTION_HEALTH_URL }}"
          app_name="$configured_app_name"

          if [ -z "$app_name" ] && [ -n "$configured_health_url" ]; then
            health_host="$(printf '%s' "$configured_health_url" | sed -E 's#^https?://([^/]+)/?.*$#\1#')"
            if [[ "$health_host" =~ ^([a-zA-Z0-9-]+)\.azurewebsites\.net$ ]]; then
              app_name="${BASH_REMATCH[1]}"
            fi
          fi

          if [ -z "$app_name" ]; then
            app_name="al-01"
          fi

          if [ -n "$configured_health_url" ]; then
            health_url="$configured_health_url"
          else
            health_url="https://${app_name}.azurewebsites.net/public/health.php"
          fi

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "health_url=$health_url" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: 150cc0b0-555b-4674-a977-dfb62f7387ec
          tenant-id: cb4f9603-299f-4515-b736-2d50c9c37494
          subscription-id: e2eb7728-917f-4818-b7d7-8e82228f9d22

      - name: Deploy to Azure Web App
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.target.outputs.app_name }}
          package: deploy_package

      - name: Verify deployed application health
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          HEALTH_URL="${{ steps.target.outputs.health_url }}"
          echo "Waiting for $HEALTH_URL"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL"; then
              echo
              echo "Deployment health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "Deployment did not become healthy."
          exit 1
