name: Assemble Fix 292 AI gateway staging v2

on:
  push:
    branches:
      - server-fix292-stage2

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: server-fix292-stage2
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'

      - name: Assemble and verify exact gateway
        shell: bash
        run: |
          set -euo pipefail
          cat .ai-upload/fix292/part01.txt \
              .ai-upload/fix292/part02.txt \
              .ai-upload/fix292/part03.txt \
              .ai-upload/fix292/part04.txt \
              .ai-upload/fix292/part05.txt \
              .ai-upload/fix292/part06.txt \
              .ai-upload/fix292/part07.txt \
              .ai-upload/fix292/part08.txt > public/api/ai_agent.php
          ACTUAL="$(git hash-object public/api/ai_agent.php)"
          EXPECTED="fa8832205974cceee79683047d1d7bca5f70aaa4"
          echo "ai_agent blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          php -l public/api/ai_agent.php
          php -l public/api/model_router.php
          php -l public/api/quota_manager.php
          php -r '$j=json_decode(file_get_contents("public/api/intent_catalog.json"),true); if(!is_array($j)){fwrite(STDERR,"invalid intent_catalog.json\n"); exit(1);} echo "intent_catalog.json OK\n";'

      - name: Commit clean staged result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ai-upload/fix292
          rm -f .github/workflows/assemble-fix292-v2.yml
          git config user.name "Hercule Fix 292 Stager"
          git config user.email "111614460+Hercule0@users.noreply.github.com"
          git add -A
          git commit -m "Stage verified Fix 292 AI gateway"
          git push origin HEAD:server-fix292-stage2
