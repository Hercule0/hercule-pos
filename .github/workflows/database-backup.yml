name: Encrypted database backup

on:
  schedule:
    # 00:30 UTC = 03:30 Iraq time; one verified backup per day.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-database-backup
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: pos

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: restore-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prostore-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2 / Node 24
        with:
          client-id: 150cc0b0-555b-4674-a977-dfb62f7387ec
          tenant-id: cb4f9603-299f-4515-b736-2d50c9c37494
          subscription-id: e2eb7728-917f-4818-b7d7-8e82228f9d22

      - name: Create and restore-verify encrypted production backup
        shell: bash
        run: |
          set -Eeuo pipefail

          resource_group="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" --output tsv)"
          if [ -z "$resource_group" ]; then
            echo "Could not resolve Azure Web App resource group." >&2
            exit 1
          fi

          settings="$(az webapp config appsettings list --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" --output json)"
          get_setting() {
            jq -r --arg name "$1" '[.[] | select(.name == $name) | .value][0] // empty' <<<"$settings"
          }

          export DB_HOST="$(get_setting DB_HOST)"
          export DB_PORT="$(get_setting DB_PORT)"
          export DB_NAME="$(get_setting DB_NAME)"
          export DB_USER="$(get_setting DB_USER)"
          export DB_PASS="$(get_setting DB_PASS)"
          export BACKUP_ENCRYPTION_KEY="$(get_setting BACKUP_ENCRYPTION_KEY)"
          export BACKUP_DIR="${RUNNER_TEMP}/encrypted-backup"
          export BACKUP_RETENTION_COUNT="7"

          DB_PORT="${DB_PORT:-3306}"
          export DB_PORT

          for value in "$DB_PASS" "$BACKUP_ENCRYPTION_KEY"; do
            [ -n "$value" ] && echo "::add-mask::$value"
          done

          missing=0
          for name in DB_HOST DB_NAME DB_USER DB_PASS BACKUP_ENCRYPTION_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Azure App Setting ${name} is missing." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          bash scripts/backup_database.sh

          backup_file="$(find "$BACKUP_DIR" -name '*.sql.enc' -type f -print -quit)"
          if [ -z "$backup_file" ]; then
            echo "Backup script completed without producing an encrypted archive." >&2
            exit 1
          fi

          export VERIFY_DB_HOST=127.0.0.1
          export VERIFY_DB_PORT=3306
          export VERIFY_DB_NAME=hercule_restore_test
          export VERIFY_DB_USER=root
          export VERIFY_DB_PASS=restore-test-password
          bash scripts/verify_backup.sh "$backup_file"

      - name: Sync verified backup to Azure persistent storage
        shell: bash
        run: |
          set -Eeuo pipefail

          resource_group="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" --output tsv)"
          profile="$(az webapp deployment list-publishing-profiles --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" --output json --query "[?publishMethod=='MSDeploy'] | [0]")"
          kudu_user="$(jq -r '.userName // empty' <<<"$profile")"
          kudu_pass="$(jq -r '.userPWD // empty' <<<"$profile")"
          publish_url="$(jq -r '.publishUrl // empty' <<<"$profile")"

          if [ -z "$kudu_user" ] || [ -z "$kudu_pass" ] || [ -z "$publish_url" ]; then
            echo "Could not obtain Azure Kudu publishing profile for backup sync." >&2
            exit 1
          fi
          echo "::add-mask::$kudu_user"
          echo "::add-mask::$kudu_pass"

          kudu_host="${publish_url#https://}"
          kudu_host="${kudu_host#http://}"
          kudu_host="${kudu_host%%:*}"
          kudu_base="https://${kudu_host}"

          mkdir_payload="$(jq -nc --arg command 'mkdir -p /home/backups/hercule-pos' '{command:$command,dir:"/home"}')"
          curl --fail --silent --show-error \
            -u "$kudu_user:$kudu_pass" \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "$mkdir_payload" \
            "$kudu_base/api/command" >/dev/null

          shopt -s nullglob
          files=("${RUNNER_TEMP}/encrypted-backup"/*.sql.enc "${RUNNER_TEMP}/encrypted-backup"/*.sha256 "${RUNNER_TEMP}/encrypted-backup"/*.hmac)
          if [ "${#files[@]}" -lt 3 ]; then
            echo "Verified backup sidecar files are incomplete." >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            name="$(basename "$file")"
            curl --fail --silent --show-error \
              -u "$kudu_user:$kudu_pass" \
              -X PUT \
              --data-binary "@$file" \
              "$kudu_base/api/vfs/home/backups/hercule-pos/$name" >/dev/null
          done

          prune_command='cd /home/backups/hercule-pos || exit 1; n=0; for f in $(ls -1t *.sql.enc 2>/dev/null); do n=$((n+1)); if [ "$n" -gt 7 ]; then rm -f -- "$f" "$f.sha256" "$f.hmac"; fi; done'
          prune_payload="$(jq -nc --arg command "$prune_command" '{command:$command,dir:"/home/backups/hercule-pos"}')"
          curl --fail --silent --show-error \
            -u "$kudu_user:$kudu_pass" \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "$prune_payload" \
            "$kudu_base/api/command" >/dev/null

      - name: Upload verified encrypted backup off-server
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24
        with:
          name: hercule-db-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/encrypted-backup/*.sql.enc
            ${{ runner.temp }}/encrypted-backup/*.sha256
            ${{ runner.temp }}/encrypted-backup/*.hmac
          retention-days: 14
          if-no-files-found: error
