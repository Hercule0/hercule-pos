name: Assemble Fix 292 AI gateway staging

on:
  push:
    branches:
      - server-fix292-stage

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: server-fix292-stage
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'

      - name: Assemble and verify exact gateway
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ai-upload/fix292/ai_agent.b64 > public/api/ai_agent.php
          ACTUAL="$(git hash-object public/api/ai_agent.php)"
          EXPECTED="fa8832205974cceee79683047d1d7bca5f70aaa4"
          echo "ai_agent blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          php -l public/api/ai_agent.php
          php -l public/api/model_router.php
          php -l public/api/quota_manager.php
          php -r '$j=json_decode(file_get_contents("public/api/intent_catalog.json"),true); if(!is_array($j)){fwrite(STDERR,"invalid intent_catalog.json\n"); exit(1);} echo "intent_catalog.json OK\n";'

      - name: Commit clean staged result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ai-upload/fix292
          rm -f .github/workflows/assemble-fix292.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/api .ai-upload .github/workflows/assemble-fix292.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy Fix 292 AI gateway"
          git push origin HEAD:server-fix292-stage
